# live-config defaults for the SnapshOT live session (username/hostname come
# from the kernel command line set in auto/config).
LIVE_USER_FULLNAME="SnapshOT operator"

# Replaces live-config's default list (audio cdrom dip floppy video plugdev
# netdev powerdev scanner bluetooth debian-tor). Same groups as the installed
# user (calamares users.conf) minus sudo, which live-config handles itself:
# dialout for serial consoles, kvm for qemu, wireshark for capture through
# dumpcap (hook 0600). user-setup skips groups that do not exist.
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev dialout kvm wireshark"
