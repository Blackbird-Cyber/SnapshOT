# SnapshOT override of live-build's share/bootloaders/grub-pc/config.cfg.
# Identical to upstream except gfxmode=auto (upstream pins 800x600 when the
# unicode font loads, which squashes the 16:9 splash). Keep in sync with
# /usr/share/live/build/bootloaders/grub-pc/config.cfg when live-build updates.
set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
