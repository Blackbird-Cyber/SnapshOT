# Copyright and license of every file in the repository, by path (REUSE
# specification 3.3). When several annotations match a file, the last one wins,
# so the list runs from the general rule to the exceptions. `reuse lint` checks
# it; see CONTRIBUTING.md.
version = 1

# Code, configuration and packaging: Apache-2.0.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Blackbird Cyber, LLC"
SPDX-License-Identifier = "Apache-2.0"

# Documentation: docs/, the SnapshOT Wiki pages, templates and text data, and the
# field kit's printed documents.
[[annotations]]
path = [
    "docs/**",
    "packages/snapshot-wiki/docs/**",
    "packages/snapshot-wiki/templates/**",
    "packages/snapshot-wiki/data/folders.yaml",
    "packages/snapshot-wiki/data/lifecycle.yaml",
    "packages/snapshot-wiki/data/protocols.yaml",
    "packages/snapshot-fieldkit/rootfs/usr/share/snapshot/fieldkit/docs/*.txt",
    "packages/snapshot-fieldkit/rootfs/usr/share/snapshot/fieldkit/README.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Blackbird Cyber, LLC"
SPDX-License-Identifier = "CC-BY-4.0"

# The Apache License text shipped on the field kit stick.
[[annotations]]
path = "packages/snapshot-fieldkit/rootfs/usr/share/snapshot/fieldkit/docs/LICENSE.txt"
precedence = "closest"
SPDX-FileCopyrightText = "2004 The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# The Contributor Covenant, adopted as published.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Contributor Covenant contributors <https://www.contributor-covenant.org>"
SPDX-License-Identifier = "CC-BY-4.0"

# MITRE ATT&CK for ICS ids, names and tactic descriptions. The field_view text
# in the same file is Blackbird Cyber's.
[[annotations]]
path = "packages/snapshot-wiki/data/attack-ics.yaml"
precedence = "override"
SPDX-FileCopyrightText = ["2026 The MITRE Corporation", "2026 Blackbird Cyber, LLC"]
SPDX-License-Identifier = "LicenseRef-MITRE-ATTACK-Terms"

# Wiki pages that quote ATT&CK for ICS ids and names, and the hook that writes
# MITRE's credit line. Their own "(c) MITRE" lines would otherwise be taken as
# the whole copyright of the file.
[[annotations]]
path = [
    "packages/snapshot-wiki/docs/lifecycle/attack-ics/index.md",
    "packages/snapshot-wiki/docs/lifecycle/crosswalk.md",
]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Blackbird Cyber, LLC", "2026 The MITRE Corporation"]
SPDX-License-Identifier = "CC-BY-4.0 AND LicenseRef-MITRE-ATTACK-Terms"

[[annotations]]
path = ["NOTICE", "packages/snapshot-wiki/hooks/snapshot_wiki.py"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Blackbird Cyber, LLC"
SPDX-License-Identifier = "Apache-2.0"

# Brand assets: all rights reserved, see TRADEMARKS.md.
[[annotations]]
path = [
    "branding/**",
    "config/bootloaders/grub-pc/splash.png",
    "docs/images/**",
    "packages/calamares-settings-snapshot/rootfs/etc/calamares/branding/snapshot/banner.png",
    "packages/calamares-settings-snapshot/rootfs/etc/calamares/branding/snapshot/icon.svg",
    "packages/calamares-settings-snapshot/rootfs/etc/calamares/branding/snapshot/logo.svg",
    "packages/calamares-settings-snapshot/rootfs/etc/calamares/branding/snapshot/welcome.png",
    "packages/snapshot-boot/rootfs/**/*.png",
    "packages/snapshot-themes/rootfs/usr/share/backgrounds/**",
    "packages/snapshot-themes/rootfs/usr/share/icons/**",
    "packages/snapshot-wiki/assets/img/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Blackbird Cyber, LLC"
SPDX-License-Identifier = "LicenseRef-Blackbird-Brand"

# The two README files inside the brand folders are documentation.
[[annotations]]
