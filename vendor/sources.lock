# SnapshOT vendored artifacts. One stanza per artifact; blank line between stanzas.
# type:     runtime | python | java | data | build
#           (build: fetched and built by vendor.py; never installed alone)
# kind:     tarball | zip | git-archive | deb          (archive handling)
# arch:     noarch | amd64 | arm64 | amd64, arm64     (which images get it)
# url / sha256:          arch-independent artifact
# url.<arch> / sha256.<arch>: one artifact per architecture
# size:     expected byte count of the download (optional; verified after fetch)
# strip:    top-level directories to strip on extraction (default 0)
# runtime:  name of a runtime stanza (python/java tools)
# requirements: path to a requirements.in for a venv (python tools; optional).
#           The per-arch hash-pinned locks requirements.<arch>.txt sit beside it.
# commands: name=exec, ... ; exec is relative to the tool dir; "python <path>" runs
#           the tool's venv python (or the runtime python when there is no venv)
# install:  nmap-scripts (data symlinked into nmap's script dir) | copy (default)
# build:    recipe script under vendor/recipes/ (type: build)
# build.sha256.<arch>: sha256 of the build's SHA256SUMS (TODO is filled by
#           `scripts/vendor.py update-hashes`)
# uses:     build stanzas whose output the tool's setup consumes
# setup:    vendor/setup/<tool>.py, run in the chroot after extraction
# enabled:  true | false (default true). Disabled stanzas are validated, not fetched.
# All hashes are sha256 of the downloaded archive. `scripts/vendor.py update-hashes`
# fills "TODO" values; `scripts/vendor.py fetch` refuses to proceed on TODO.

