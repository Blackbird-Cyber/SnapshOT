# SnapshOT source/binary artifact lock.
# Non-apt, non-pip tools vendored as pinned artifacts. scripts/fetch-vendor.sh
# downloads each, verifies sha256, and stores it under vendor/src/<name>/.
# Hook 0200 installs them into the image offline.
#
# Format (one record per stanza):
#   name:    <short id>
#   kind:    tarball | zip | deb | git-archive
#   url:     <download url>
#   sha256:  <hex digest>   # TODO(release): fill real digests via fetch-vendor.sh --update-hashes
#   version: <human version/commit>
#   notes:   <what/why, and menu category>

