name: Bug report
description: Something on the image, in a SnapshOT package or in a build script does not work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately, through GitHub's [private vulnerability reporting](https://github.com/Blackbird-Cyber/SnapshOT/security/advisories/new)
        as [SECURITY.md](https://github.com/Blackbird-Cyber/SnapshOT/blob/main/SECURITY.md) describes, not here.
  - type: textarea
    id: release
    attributes:
      label: Image version
      description: Paste the output of `cat /etc/snapshot-release`. If you built from source, give the commit instead.
      render: text
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Live or installed
      options:
        - Live session
        - Installed system
        - Building from source
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Hardware or VM
      description: The laptop model, or the hypervisor and its version.
      placeholder: VMware Fusion 13 on Apple Silicon
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, starting from boot or from a clean checkout.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Error messages, `journalctl -b` excerpts, or the end of `build/build.log`.
      render: text
