  - {id: lessons-learned, level: 0, group: phase, label: "6. Lessons Learned"}
  - {id: govern, level: 1, group: csf, label: "Govern"}
  - {id: identify, level: 1, group: csf, label: "Identify"}
  - {id: protect, level: 1, group: csf, label: "Protect"}
  - {id: detect, level: 1, group: csf, label: "Detect"}
