# SnapshOT Calamares — offline install, LUKS2, squashfs copy.
modules-search: [ local ]

instances:
- id:     snapshot
  module: branding

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: snapshot
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
