efiSystemPartition:     "/boot/efi"
userSwapChoices:
    - none
    - small
    - suspend
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice:      none
defaultFileSystemType:  "ext4"
availableFileSystemTypes: ["ext4","btrfs","xfs"]
enableLuksAutomatedPartitioning: true
luksGeneration:         luks2

# /boot stays outside LUKS so GRUB never has to open the volume: Calamares formats LUKS2
# with Argon2id, which Debian's GRUB cannot unlock. The passphrase is asked once, by the
# initramfs (Plymouth). Root uses defaultFileSystemType or the user's choice.
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      mountPoint: "/boot"
      noEncrypt: true
      size: 1G
    - name: "rootfs"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
