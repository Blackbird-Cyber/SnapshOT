# Strip the live-session machinery from the installed clone of the squashfs. apt works
# offline for removals; mount.conf binds /dev/pts, which apt needs for its logs.
backend: apt
update_db: false
update_system: false
skip_if_no_internet: false
operations:
    - try_remove:
        - live-boot
        - live-boot-initramfs-tools
        - live-boot-doc
        - live-config
        - live-config-doc
        - live-config-systemd
        - live-tools
        - user-setup
        - calamares-settings-snapshot
        - calamares
