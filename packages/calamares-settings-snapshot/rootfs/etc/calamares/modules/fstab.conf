# fstab/crypttab module (Calamares 3.3.14).
#
# The install puts / (with /boot) inside LUKS2; luksbootkeyfile adds
# /crypto_keyfile.bin so the initramfs can unlock root without a second
# passphrase prompt after GRUB. Debian's cryptsetup-initramfs hook skips a root
# target whose crypttab key is a plain file ("Skipping root target ...: uses a
# key file") unless KEYFILE_PATTERN matches it, so with the module default
# ("luks") the root would never be unlocked at boot. With keyscript=/bin/cat
# the key path is just an argument to the script, and the encrypt_hook that
# the initramfscfg module installs copies the keyfile into the initramfs.
# Same options as calamares-settings-debian 13.0.13.
---
crypttabOptions: luks,discard,keyscript=/bin/cat

# trixie already mounts /tmp as tmpfs through systemd's tmp.mount, so do not
# add a second /tmp entry to fstab on SSD installs (the module default would).
tmpOptions:
    default:
        tmpfs: false
