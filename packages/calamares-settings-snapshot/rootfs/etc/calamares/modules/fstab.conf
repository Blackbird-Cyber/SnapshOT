# fstab/crypttab module (Calamares 3.3.14).
#
# /boot is a separate unencrypted partition (partition.conf), so
# luksbootkeyfile creates no /crypto_keyfile.bin and this module writes the
# root crypttab entry with key "none" and no options: the initramfs asks for
# the passphrase through Plymouth, and crypttabOptions does not apply to root.
#
# Swap is a file inside the root (partition.conf), so no other entry needs the
# options either. keyscript=/bin/cat stays for a manual layout that puts /boot
# inside LUKS: there luksbootkeyfile does create /crypto_keyfile.bin, and
# Debian's cryptsetup-initramfs hook would skip a root target whose key is a
# plain file ("uses a key file"); the keyscript passes the path through and the
# encrypt_hook from initramfscfg copies the key into the initramfs. Same
# options as calamares-settings-debian 13.0.13.
---
crypttabOptions: luks,discard,keyscript=/bin/cat

# trixie already mounts /tmp as tmpfs through systemd's tmp.mount, so do not
# add a second /tmp entry to fstab on SSD installs (the module default would).
tmpOptions:
    default:
        tmpfs: false
