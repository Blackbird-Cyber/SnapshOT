# fstab/crypttab module (Calamares 3.3.14).
#
# /boot is a separate unencrypted partition (partition.conf), so
# luksbootkeyfile creates no /crypto_keyfile.bin and this module writes the
# root crypttab entry with key "none" and no options: the initramfs asks for
# the passphrase through Plymouth, and crypttabOptions does not apply to root.
#
# The options date from the earlier layout with /boot inside LUKS2, where
# luksbootkeyfile added /crypto_keyfile.bin so the initramfs could unlock root
# without a second passphrase prompt after GRUB. Debian's cryptsetup-initramfs
# hook skips a root target whose crypttab key is a plain file ("Skipping root
# target ...: uses a key file") unless KEYFILE_PATTERN matches it; with
# keyscript=/bin/cat the key path is just an argument to the script, and the
# encrypt_hook that initramfscfg installs copies the keyfile into the
# initramfs. Same options as calamares-settings-debian 13.0.13.
---
crypttabOptions: luks,discard,keyscript=/bin/cat

# trixie already mounts /tmp as tmpfs through systemd's tmp.mount, so do not
# add a second /tmp entry to fstab on SSD installs (the module default would).
tmpOptions:
    default:
        tmpfs: false
