# Bootloader module (Calamares 3.3.14): GRUB on BIOS and UEFI.
#
# grubInstall is snapshot-boot's wrapper, not grub-install itself: on UEFI it
# adds --uefi-secure-boot and --force-extra-removable, so EFI/SnapshOT and the
# removable media path EFI/BOOT both hold shim (signed by Microsoft), MokManager
# and the GRUB image signed by Debian, and it copies EFI/SnapshOT/grub.cfg next
# to the removable GRUB. BIOS installs pass through unchanged. The wrapper
# lives in snapshot-boot because the packages step removes this package from the
# target before the bootloader step runs.
#
# installEFIFallback is off: Calamares' fallback copies EFI/SnapshOT/grubx64.efi
# to EFI/boot/bootx64.efi, over the shim the wrapper put there, and firmware
# with Secure Boot on refuses GRUB started without shim.
efiBootLoader:   "grub"
grubInstall:     "/usr/lib/snapshot-boot/grub-install"
grubMkconfig:    "grub-mkconfig"
grubCfg:         "/boot/grub/grub.cfg"
efiBootloaderId: "SnapshOT"
installEFIFallback: false
