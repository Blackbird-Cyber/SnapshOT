# Welcome page (Calamares 3.3.14): pre-flight requirement checks.
#
# Without this file nothing is checked, and requiredStorageGiB is never put in
# global storage, which makes the partition module's "replace a partition" and
# "install alongside" choices unavailable (PartUtils canBeReplaced/canBeResized
# return false without it).
#
# No internet check: the install is offline (unpackfs copies the live
# squashfs). No power check either: it needs upower, which the image does not
# install, so it would always pass.
---
# The buttons stay off: the installer runs offline, so a link to the project
# or its issues on GitHub would not open.
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    # The live squashfs unpacks to about 4.1 GiB (build log); leave room for
    # a swap file, logs and captures. GiB.
    requiredStorage:    10.0
    requiredRam:        1.0
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - ram
        - root
