# Users module (Calamares 3.3.14) for the installed system.
#
# Debian's calamares package ships no module configs and this package replaces
# calamares-settings-debian, so without this file the module logs "Using
# fallback groups", puts the user in lp/video/network/storage/wheel/audio and
# has no sudoersGroup: the installed user cannot sudo.
#
# Based on calamares-settings-debian 13.0.13, trimmed to groups that exist in
# this image (config/package-lists/*.list.chroot). Calamares creates a missing
# group with a user-range GID rather than failing, so lpadmin (cups), scanner
# (sane) and bluetooth (bluez) are left out: none of those packages are
# installed. Debian's userGroup key and passwordRequirements.nonempty are
# dropped because Calamares 3.3 ignores both (minLength: 1 replaces nonempty).
---
# Supplementary groups for the created user; the primary group is the
# per-user group from useradd -U.
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    # udev rules for rtl-sdr, hackrf, libsigrok/pulseview and openocd adapters.
    - plugdev
    # Serial consoles (/dev/ttyUSB*, /dev/ttyACM*) for minicom, picocom, tio, screen.
    - dialout
    # NetworkManager's polkit rule; created by network-manager's postinst.
    - name: netdev
      system: true
    # /dev/kvm (root:kvm 0660) for the installed qemu-system-*; created by udev's sysusers.
    - name: kvm
      system: true
    # Packet capture through dumpcap without sudo (Wireshark, tshark, termshark);
    # created by wireshark-common's postinst, see hook 0600-snapshot-wireshark.
    - name: wireshark
      system: true

# Only used when the user ticks automatic login; created on demand.
autologinGroup:  autologin

# Calamares adds the user to this group and writes /etc/sudoers.d/10-installer
# for it. Debian's /etc/sudoers already grants %sudo, so the file is redundant
# but harmless.
sudoersGroup:    sudo

# No separate root password: root stays locked, administration goes through sudo.
setRootPassword: false

passwordRequirements:
    minLength: 1    # non-empty; calamares-settings-debian's "nonempty: true" is ignored by 3.3
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
