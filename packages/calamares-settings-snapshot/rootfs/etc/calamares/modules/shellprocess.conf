# Automatic restart at the end of the install. This job runs last in the exec
# sequence, on the live system (dontChroot), after the umount module has
# released the target. Its name is shown in the progress line while it waits,
# then systemd reboots the machine. If the reboot command fails, the sequence
# ends normally and the Finished page offers its Restart now checkbox.
dontChroot: true
timeout: 60
script:
    - "sleep 5"
    - "systemctl -i reboot"
i18n:
    name: "Restarting in 5 seconds"
