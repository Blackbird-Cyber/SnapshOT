# Mount module (Calamares 3.3.14): what gets mounted into the target before it
# is used as a chroot. The target's own partitions come from the partition
# module; these are the extra pseudo-filesystems.
#
# Without this file extraMounts is empty (the module only warns "Does
# mount.conf exist?"), so grub-install, update-initramfs and the other chroot
# steps run without /dev, /proc, /sys or efivarfs and fail. Same list as
# calamares-settings-debian 13.0.13.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # Only mounted on UEFI installs; efibootmgr needs it for grub-install.
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true
    - device: /dev/pts
      mountPoint: /dev/pts
      options: [ bind ]
