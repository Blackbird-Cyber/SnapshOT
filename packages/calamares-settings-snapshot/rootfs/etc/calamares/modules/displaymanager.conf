# Display manager setup for the installed system. The image ships LightDM with
# the GTK greeter and Xfce (config/package-lists/snapshot-desktop.list.chroot).
# Debian's calamares package ships no module configs; calamares-settings-debian
# did, and this package replaces it, so without this file the exec sequence
# fails with "No display managers selected for the displaymanager module".
displaymanagers:
  - lightdm

lightdm:
  preferred_greeters:
    - lightdm-gtk-greeter.desktop

# Becomes user-session= in /etc/lightdm/lightdm.conf on the target.
defaultDesktopEnvironment:
  executable:  "startxfce4"
  desktopFile: "xfce"

# The lightdm package already creates its user, group and /run/lightdm.
basicSetup:     false
# openSUSE only.
sysconfigSetup: false
