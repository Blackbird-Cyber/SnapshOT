
# SnapshOT, arm64 only: keep the Plymouth splash, and with it the disk
# passphrase prompt, on the screen (applied by update-grub on the installed
# system).
#
# arm64 firmware often names a serial port as the console: QEMU's virt machine,
# which UTM uses, puts its PL011 UART in the device tree's stdout-path, and ACPI
# firmware can do the same with an SPCR table. The kernel console is then the
# serial port, and Plymouth, finding a serial console, shows its text prompt
# there and nothing on the screen: an encrypted install boots to a black screen
# on which typing does nothing. plymouth.ignore-serial-consoles makes Plymouth
# leave serial consoles alone and draw the splash, prompt included, on the
# display. To unlock over a serial console instead, remove the word from the
# linux line at the GRUB menu (e, then Ctrl-x); to do that on every boot,
# delete this file and run update-grub (dpkg keeps a deleted conffile deleted).
#
# grub-mkconfig sources this file after /etc/default/grub and
# 60-snapshot-theme.cfg. It appends the word on arm64 only, and only when it
# is missing; on other architectures it changes nothing.
case "$(dpkg --print-architecture 2>/dev/null)" in
    arm64)
        case " $GRUB_CMDLINE_LINUX_DEFAULT " in
            *" plymouth.ignore-serial-consoles "*) ;;
            *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }plymouth.ignore-serial-consoles" ;;
        esac
        ;;
esac
