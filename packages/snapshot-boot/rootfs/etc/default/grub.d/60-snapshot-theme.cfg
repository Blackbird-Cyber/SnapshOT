# SnapshOT GRUB appearance (applied by update-grub on the installed system).
GRUB_THEME="/boot/grub/themes/snapshot/theme.txt"
GRUB_BACKGROUND=""
GRUB_GFXMODE="auto"
GRUB_GFXPAYLOAD_LINUX="keep"
# Plymouth only draws its theme when "splash" is on the kernel command line.
# grub-mkconfig sources this file after /etc/default/grub, where the installer
# (Calamares grubcfg) has already put quiet, splash and any resume= or
# cryptdevice= parameters: append quiet and splash only when they are missing,
# never replace the line.
for _opt in quiet splash; do
    case " $GRUB_CMDLINE_LINUX_DEFAULT " in *" $_opt "*) ;; *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }$_opt" ;; esac
done
unset _opt
